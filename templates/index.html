<!DOCTYPE html>
<html>
<head>
  <title>Student Budgeting App</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <div class="container">
    <h1>💰 Student Budgeting App</h1>
    <p>Enter your expenses per category:</p>
    <div id="expense-form">
      {% for cat in categories %}
        <label>{{ cat }}</label>
        <input type="number" id="{{ cat }}" placeholder="Enter amount">
        <button onclick="updateExpense('{{ cat }}')">Submit</button><br>
      {% endfor %}
    </div>
    <a href="/summary">➡ View Summary</a>
  </div>
  <script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
